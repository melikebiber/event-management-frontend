<header class="navbar">

  <div class="navbar-container">

    <a routerLink="/" class="logo">
  etkinli<span>x</span>
</a>
    <nav class="nav-links">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Ana Sayfa
      </a>

      <a
        routerLink="/events"
        routerLinkActive="active"
      >
        Etkinlikler
      </a>

      @if (authService.isLoggedIn()) {

        <a
          routerLink="/my-events"
          routerLinkActive="active"
        >
          Etkinliklerim
        </a>
<a
    routerLink="/profile"
    routerLinkActive="active"
  >
    Profilim
  </a>
  @if (isAdmin()) {
  <a
    routerLink="/admin"
    routerLinkActive="active"
  >
    Admin
  </a>
}
       <button
  type="button"
  class="logout-button"
  (click)="openLogoutModal()"
>
  Çıkış Yap
</button>

      } @else {

        <a
          routerLink="/login"
          routerLinkActive="active"
        >
          Giriş Yap
        </a>

        <a
          class="register-link"
          routerLink="/register"
          routerLinkActive="active"
        >
          Kayıt Ol
        </a>

      }


    </nav>

  </div>

</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
@if (isLogoutModalOpen) {
  <div
    class="logout-modal-backdrop"
    (click)="closeLogoutModal()"
  >
    <section
      class="logout-modal"
      (click)="$event.stopPropagation()"
    >
      <div class="logout-modal-icon">
        ↪
      </div>

      <h2>Çıkış yapmak istiyor musunuz?</h2>

      <p>
        Hesabınızdan çıkış yapacaksınız.
        Devam etmek istediğinize emin misiniz?
      </p>

      <div class="logout-modal-actions">
        <button
          type="button"
          class="logout-cancel-button"
          (click)="closeLogoutModal()"
        >
          Vazgeç
        </button>

        <button
          type="button"
          class="logout-confirm-button"
          (click)="confirmLogout()"
        >
          Çıkış Yap
        </button>
      </div>
    </section>
  </div>
}
